<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forge Athlete Portal</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top" hidden>
  <div class="wrap">
    <div class="brand"><img class="logo" alt="The Forge" src="logo.png"><span style="border-left:1px solid var(--border);padding-left:10px">Athlete Development Portal</span></div>
    <span class="sm muted" id="who"></span>
    <div class="seg" role="tablist" aria-label="Switch view" id="roles"></div>
    <button class="btn ghost sm" data-act="changepw">Change password</button>
    <button class="btn ghost sm" data-act="signout">Sign out</button>
  </div>
</header>
<main><div class="wrap" id="main"></div></main>
<div id="modal"></div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
